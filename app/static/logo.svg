<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <title>rerouter</title>
  <!-- Two original routes (grey) recombined into a new line (orange) via two connection points. -->
  <g fill="none" stroke-linejoin="round" stroke-linecap="round">
    <polyline points="6,24 18,14 30,22 42,12 58,18" stroke="#a9a79f" stroke-width="2"/>
    <polyline points="6,46 20,52 32,42 44,50 58,40" stroke="#a9a79f" stroke-width="2"/>
    <polyline points="6,24 18,14 30,22 32,42 44,50 58,40" stroke="#b35c1e" stroke-width="4.2"/>
  </g>
  <g fill="#ffffff" stroke-width="1.6">
    <g stroke="#8f8d85">
      <circle cx="42" cy="12" r="2"/><circle cx="58" cy="18" r="2"/><circle cx="6" cy="46" r="2"/><circle cx="20" cy="52" r="2"/>
    </g>
    <g stroke="#b35c1e">
      <circle cx="6" cy="24" r="2"/><circle cx="18" cy="14" r="2"/><circle cx="44" cy="50" r="2"/><circle cx="58" cy="40" r="2"/>
    </g>
  </g>
  <g fill="#b35c1e" stroke="#ffffff" stroke-width="1.4">
    <circle cx="30" cy="22" r="2.8"/><circle cx="32" cy="42" r="2.8"/>
  </g>
</svg>
